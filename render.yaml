services:
  # Backend service (FastAPI)
  - type: web
    name: moviematch-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.15

  # Frontend service (Static site)
  - type: web
    name: moviematch-frontend
    env: static
    buildCommand: "echo 'Frontend build complete'"
    staticPublishPath: .
    envVars:
      - key: RENDER_BUILD_COMMAND
        value: "echo 'No build required for static site'"